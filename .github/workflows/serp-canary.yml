name: SERP Canary (러너 IP 차단율 측정)

# 배치를 Vercel 함수에서 GitHub 러너로 옮기기 전에, 러너 IP에서 네이버 통합검색이 정상 응답하는지 잰다.
# DB·서버에 접근하지 않고 일반 검색어만 호출한다. 결과는 실행 화면의 Summary 에 표로 남는다.
# 며칠 측정해 판단이 끝나면 이 워크플로우는 삭제한다.

# 정기 실행은 2026-10-08에 멈췄다. 측정 결과: 러너 VM의 약 40%가 첫 요청부터 403(IP 단위 차단).
# 정기 배치에는 러너 실패 시 Vercel 대체 경로가 있으므로 더 재지 않는다. 필요하면 수동으로 돌린다.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "요청 수"
        required: false
        default: "60"
      interval:
        description: "요청 간격(초)"
        required: false
        default: "10"

jobs:
  canary:
    name: 네이버 통합검색 응답 측정
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 측정 실행
        run: node scripts/serp-canary.mjs "${{ inputs.count || '200' }}" "${{ inputs.interval || '10' }}"
