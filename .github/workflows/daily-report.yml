name: Daily Report

# 리포트 메일 발송. 정기 발송은 daily-batch.yml의 report job이 배치 완료 직후 이 워크플로우를 호출한다.
# (고정 시각 cron은 배치가 끝나기 전에 메일이 나가는 문제가 있어 제거)
# 수동 재발송: Actions UI에서 Run workflow.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger /api/cafe/daily-report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call daily-report endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          echo "::group::Trigger daily-report"
          RESPONSE=$(curl -fsSL --max-time 60 -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\n---HTTP=%{http_code} TIME=%{time_total}s" \
            "https://doctor-blog-marketing.vercel.app/api/cafe/daily-report")
          echo "$RESPONSE"
          echo "::endgroup::"

          STATUS=$(echo "$RESPONSE" | grep -oE 'HTTP=[0-9]+' | tail -1 | cut -d= -f2)
          if [ "$STATUS" != "200" ]; then
            echo "::error::daily-report returned HTTP $STATUS"
            exit 1
          fi
          echo "::notice::daily-report triggered successfully"
