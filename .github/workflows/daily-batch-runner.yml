name: Daily Batch (러너 직접 실행) — 시험용

# 순위 수집을 Vercel 함수 호출 대신 러너에서 직접 실행하는 방식. 아직 수동 실행만 가능하다.
# 기존 "Daily Batch (KST 03:00)" 와 같은 키워드를 처리하므로 둘을 같은 날 함께 돌릴 필요는 없다
# (스크립트가 오늘 이미 수집된 키워드를 건너뛰므로 겹쳐도 중복 수집은 없다).
#
# 필요한 저장소 시크릿: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# 로그에는 병원명·키워드를 찍지 않고 집계 숫자만 남긴다 (공개 저장소).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "처리할 종류 (all/blog/cafe/reporter)"
        required: false
        default: "all"
      limit:
        description: "종류별 최대 처리 건수 (비우면 전부)"
        required: false
        default: ""
      force:
        description: "오늘 이미 수집된 키워드도 다시 수집 (true/false)"
        required: false
        default: "false"

# 수집 스트림이 겹치지 않게 한 번에 하나만 실행
concurrency:
  group: naver-crawl-runner
  cancel-in-progress: false

jobs:
  batch:
    name: ${{ matrix.mode }} 수집
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        mode: [blog, cafe, reporter]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_THIS: ${{ inputs.mode == 'all' || inputs.mode == '' || inputs.mode == matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_THIS == 'true'
      - uses: actions/setup-node@v4
        if: env.RUN_THIS == 'true'
        with:
          node-version: 24
          cache: npm
      - name: 의존성 설치
        if: env.RUN_THIS == 'true'
        run: npm ci
      - name: 수집 실행
        if: env.RUN_THIS == 'true'
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::저장소 시크릿 NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 가 없습니다."
            exit 1
          fi
          ARGS="--mode ${{ matrix.mode }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          npx tsx scripts/daily-batch.mts $ARGS
