name: Batch Runner (순위 수집, 러너 직접 실행)

# 순위 수집을 Vercel 함수 호출 대신 GitHub 러너에서 직접 실행한다.
#   - Daily Batch 워크플로우가 블로그 → 기자단 → 카페 순으로 이 워크플로우를 호출한다 (workflow_call).
#   - 수동으로도 실행할 수 있다 (workflow_dispatch). 중단된 뒤 다시 돌리면 오늘 이미 수집된 키워드는 건너뛴다.
# 한 번에 한 종류씩만 돌린다 — 러너 IP 하나에서 나가는 요청 간격(10초)을 카나리에서 검증한 수준으로 유지하기 위해서다.
#
# 필요한 저장소 시크릿: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# 로그에는 병원명·키워드를 찍지 않고 집계 숫자만 남긴다 (공개 저장소).

on:
  workflow_call:
    inputs:
      mode:
        description: "처리할 종류 (all/blog/cafe/reporter)"
        type: string
        required: true
      limit:
        type: string
        required: false
        default: ""
      force:
        type: string
        required: false
        default: "false"
  workflow_dispatch:
    inputs:
      mode:
        description: "처리할 종류 (all/blog/cafe/reporter)"
        required: false
        default: "all"
      limit:
        description: "종류별 최대 처리 건수 (비우면 전부)"
        required: false
        default: ""
      force:
        description: "오늘 이미 수집된 키워드도 다시 수집 (true/false)"
        required: false
        default: "false"

jobs:
  batch:
    name: ${{ inputs.mode }} 수집
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # 수집 스트림이 겹치지 않게 한 번에 하나만 실행 (수동 실행이 정기 실행과 겹치면 기다린다)
    concurrency:
      group: naver-crawl-runner
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 수집 실행
        env:
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::저장소 시크릿 NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 가 없습니다."
            exit 1
          fi
          ARGS=""
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          case "$MODE" in
            all|"") MODES="blog reporter cafe" ;;
            blog|cafe|reporter) MODES="$MODE" ;;
            *) echo "::error::mode 값이 잘못됨: $MODE"; exit 1 ;;
          esac
          FAILED=0
          for m in $MODES; do
            echo "::group::$m 수집"
            npx tsx scripts/daily-batch.mts --mode "$m" $ARGS || { echo "::warning::$m 수집이 비정상 종료"; FAILED=1; }
            echo "::endgroup::"
          done
          exit $FAILED
