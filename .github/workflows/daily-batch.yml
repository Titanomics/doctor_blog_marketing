name: Daily Batch (KST 새벽) — 러너 직접 수집

# 순위 수집(블로그 → 기자단 → 카페)은 GitHub 러너에서 직접 실행한다 (daily-batch-runner.yml 호출).
#   - Vercel 함수의 실행 시간 제한·체인 끊김과 무관하고, 한 스트림씩 돌아 요청 간격이 일정하다.
#   - 오늘 이미 수집된 키워드는 건너뛰므로 중간에 끊겨도 다시 실행하면 이어서 한다.
# 조회수·검색량·리포트·슬랙 알림은 그대로 Vercel API를 호출한다.
# 세 수집이 모두 끝나면 report job이 리포트 메일을, alert job이 슬랙 알림을 보낸다.

on:
  schedule:
    # UTC 17:17 = KST 02:17. 정각(:00) cron은 GitHub 혼잡으로 2~5시간씩 밀려서 정각을 피했다.
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: "처리할 도메인 (all/blog/cafe/reporter)"
        required: false
        default: "all"

env:
  BASE_URL: https://doctor-blog-marketing.vercel.app
  # (Vercel 대체 경로용) chunk 사이 sleep · chunk 크기 (서버 코드 CHUNK_SIZE와 일치)
  CHUNK_INTERVAL_S: 20
  CHUNK_SIZE: 20

jobs:
  # GitHub은 60일간 커밋이 없으면 스케줄 워크플로우를 자동 비활성화함.
  # 매 실행마다 enable API를 호출해 비활성화 타이머를 리셋 (커밋 없이 유지).
  keepalive:
    name: 워크플로우 자동 비활성화 방지
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: enable API 호출로 타이머 리셋
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-batch.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-report.yml/enable"

  blog-batch:
    name: 블로그 수집
    if: ${{ inputs.domain == '' || inputs.domain == 'all' || inputs.domain == 'blog' }}
    uses: ./.github/workflows/daily-batch-runner.yml
    with:
      mode: blog
    secrets: inherit
  post-stats:
    name: 카페 글 조회수 수집
    if: ${{ inputs.domain == '' || inputs.domain == 'all' || inputs.domain == 'cafe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 오늘 관측이 없는 글이 0이 될 때까지 반복 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          for i in $(seq 1 12); do
            RESP=$(curl -fsS -m 290 -X POST -H "$AUTH_HEADER" "$BASE_URL/api/cafe/post-stats?limit=100") || { echo "::warning::post-stats 호출 실패 (iteration $i)"; break; }
            # 글 식별자는 로그에 남기지 않고 집계 숫자만 출력
            echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ('date','posts','targets','alreadyDone','processed','saved','failed','remaining','unresolvedUrls','stopped')})"
            SAVED=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('saved', 0))")
            REMAINING=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('remaining', 0))")
            STOPPED=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('stopped') or '')")
            if [ "$REMAINING" -le 0 ]; then echo "::notice::조회수 수집 완료"; break; fi
            if [ "$STOPPED" = "consecutive_failures" ]; then echo "::warning::연속 실패로 중단 (차단·장애 의심), 남은 글 $REMAINING"; break; fi
            if [ "$SAVED" -le 0 ]; then echo "::warning::진전 없음, 남은 글 $REMAINING"; break; fi
            sleep 5
          done

  cafe-batch:
    name: 카페 수집
    # 조회수 수집이 실패해도, 앞선 수집이 실패해도 카페 수집은 진행한다
    needs: [post-stats, reporter-batch]
    if: ${{ always() && (inputs.domain == '' || inputs.domain == 'all' || inputs.domain == 'cafe') }}
    uses: ./.github/workflows/daily-batch-runner.yml
    with:
      mode: cafe
    secrets: inherit
  reporter-batch:
    name: 기자단 수집
    needs: [blog-batch]
    if: ${{ always() && (inputs.domain == '' || inputs.domain == 'all' || inputs.domain == 'reporter') }}
    uses: ./.github/workflows/daily-batch-runner.yml
    with:
      mode: reporter
    secrets: inherit
  blog-fallback:
    name: 블로그 수집 (Vercel 대체 — 러너 실패 시)
    # 러너 IP가 네이버에 막히는 등으로 러너 수집이 실패하면 예전 방식(Vercel 함수 chunk 호출)으로 대신 돌린다.
    # 오늘 이미 수집된 키워드도 다시 수집되지만, previous_rank 규칙(당일 갱신은 전날 값 유지)이 있어 해롭지 않다.
    needs: [blog-batch]
    if: ${{ always() && needs.blog-batch.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5시간 50분 (안전 마진)
    steps:
      - name: 블로그 clients × chunks 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Bearer $CRON_SECRET"

          echo "::group::블로그 client 목록"
          CLIENTS_JSON=$(curl -fsSL --retry 3 --retry-all-errors -m 60 -H "$AUTH_HEADER" "$BASE_URL/api/clients")
          CLIENT_IDS=$(echo "$CLIENTS_JSON" | python3 -c "import json,sys; [print(c['id']) for c in json.load(sys.stdin)]")
          echo "$CLIENT_IDS"
          echo "::endgroup::"

          for CLIENT_ID in $CLIENT_IDS; do
            echo "::group::Client $CLIENT_ID"
            # 키워드 수
            COUNT=$(curl -fsSL --retry 3 --retry-all-errors -m 60 -H "$AUTH_HEADER" "$BASE_URL/api/keywords?clientId=$CLIENT_ID" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))") \
              || { echo "::warning::client $CLIENT_ID 키워드 수 조회 실패 — 건너뜀"; echo "::endgroup::"; continue; }
            echo "키워드: $COUNT개"

            if [ "$COUNT" -le 0 ]; then echo "skip (키워드 없음)"; echo "::endgroup::"; continue; fi
            if [ "$COUNT" -le 10 ]; then
              # 작은 client: 동기 처리 라우트
              echo "동기 처리 호출"
              curl -fsSL -m 300 -H "$AUTH_HEADER" -X POST "$BASE_URL/api/batch-track?clientId=$CLIENT_ID" -w "\nHTTP=%{http_code} TIME=%{time_total}s\n" || echo "::warning::client $CLIENT_ID 동기 호출 실패"
              echo "::endgroup::"
              continue
            fi

            # 큰 client: chunks 직접 호출
            OFFSET=0
            while [ "$OFFSET" -lt "$COUNT" ]; do
              echo "chunk offset=$OFFSET limit=$CHUNK_SIZE"
              curl -fsSL -m 280 -H "$AUTH_HEADER" -X POST \
                "$BASE_URL/api/batch-track?clientId=$CLIENT_ID&offset=$OFFSET&limit=$CHUNK_SIZE" \
                -w "\nHTTP=%{http_code} TIME=%{time_total}s\n" \
                || echo "::warning::client $CLIENT_ID offset=$OFFSET chunk 실패"
              OFFSET=$((OFFSET + CHUNK_SIZE))
              if [ "$OFFSET" -lt "$COUNT" ]; then sleep $CHUNK_INTERVAL_S; fi
            done
            echo "::endgroup::"
          done

  reporter-fallback:
    name: 기자단 수집 (Vercel 대체 — 러너 실패 시)
    # 러너 IP가 네이버에 막히는 등으로 러너 수집이 실패하면 예전 방식(Vercel 함수 chunk 호출)으로 대신 돌린다.
    # 오늘 이미 수집된 키워드도 다시 수집되지만, previous_rank 규칙(당일 갱신은 전날 값 유지)이 있어 해롭지 않다.
    needs: [reporter-batch]
    if: ${{ always() && needs.reporter-batch.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 기자단 clients × chunks 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Bearer $CRON_SECRET"

          echo "::group::기자단 client 목록 (cafe_clients 공유)"
          CLIENTS_JSON=$(curl -fsSL --retry 3 --retry-all-errors -m 60 -H "$AUTH_HEADER" "$BASE_URL/api/cafe/clients")
          CLIENT_IDS=$(echo "$CLIENTS_JSON" | python3 -c "import json,sys; [print(c['id']) for c in json.load(sys.stdin)]")
          echo "$CLIENT_IDS"
          echo "::endgroup::"

          for CLIENT_ID in $CLIENT_IDS; do
            echo "::group::Client $CLIENT_ID"
            # 기자단은 keyword count API가 없어 batch-track의 응답으로 chunk 분기
            curl -fsSL -m 300 -H "$AUTH_HEADER" -X POST "$BASE_URL/api/reporter/batch-track?clientId=$CLIENT_ID" -w "\nHTTP=%{http_code} TIME=%{time_total}s\n" || echo "::warning::reporter client $CLIENT_ID 호출 실패"
            # 작은 client는 동기 응답, 큰 client는 chunk 체인 시작 응답
            # 큰 client의 chunks는 서버 체인이 처리하지만 끊길 수 있음 → 추후 별도 워크플로우 권장
            echo "::endgroup::"
            sleep 60  # client 사이 1분 간격
          done

  cafe-fallback:
    name: 카페 수집 (Vercel 대체 — 러너 실패 시)
    # 러너 IP가 네이버에 막히는 등으로 러너 수집이 실패하면 예전 방식(Vercel 함수 chunk 호출)으로 대신 돌린다.
    # 오늘 이미 수집된 키워드도 다시 수집되지만, previous_rank 규칙(당일 갱신은 전날 값 유지)이 있어 해롭지 않다.
    needs: [cafe-batch]
    if: ${{ always() && needs.cafe-batch.result == 'failure' }}
    # 조회수 수집이 실패해도 카페 배치는 진행한다
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 카페 clients × chunks 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Bearer $CRON_SECRET"

          echo "::group::카페 client 목록"
          CLIENTS_JSON=$(curl -fsSL --retry 3 --retry-all-errors -m 60 -H "$AUTH_HEADER" "$BASE_URL/api/cafe/clients")
          CLIENT_IDS=$(echo "$CLIENTS_JSON" | python3 -c "import json,sys; [print(c['id']) for c in json.load(sys.stdin)]")
          echo "$CLIENT_IDS"
          echo "::endgroup::"

          for CLIENT_ID in $CLIENT_IDS; do
            echo "::group::Client $CLIENT_ID"
            COUNT=$(curl -fsSL --retry 3 --retry-all-errors -m 60 -H "$AUTH_HEADER" "$BASE_URL/api/cafe/keywords?clientId=$CLIENT_ID" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))") \
              || { echo "::warning::client $CLIENT_ID 키워드 수 조회 실패 — 건너뜀"; echo "::endgroup::"; continue; }
            echo "키워드: $COUNT개"

            if [ "$COUNT" -le 0 ]; then echo "skip"; echo "::endgroup::"; continue; fi
            if [ "$COUNT" -le 10 ]; then
              curl -fsSL -m 300 -H "$AUTH_HEADER" -X POST "$BASE_URL/api/cafe/batch-track?clientId=$CLIENT_ID" -w "\nHTTP=%{http_code} TIME=%{time_total}s\n" || echo "::warning::client $CLIENT_ID 동기 호출 실패"
              echo "::endgroup::"
              continue
            fi

            OFFSET=0
            while [ "$OFFSET" -lt "$COUNT" ]; do
              echo "chunk offset=$OFFSET limit=$CHUNK_SIZE"
              curl -fsSL -m 280 -H "$AUTH_HEADER" -X POST \
                "$BASE_URL/api/cafe/batch-track?clientId=$CLIENT_ID&offset=$OFFSET&limit=$CHUNK_SIZE" \
                -w "\nHTTP=%{http_code} TIME=%{time_total}s\n" \
                || echo "::warning::client $CLIENT_ID offset=$OFFSET chunk 실패"
              OFFSET=$((OFFSET + CHUNK_SIZE))
              if [ "$OFFSET" -lt "$COUNT" ]; then sleep $CHUNK_INTERVAL_S; fi
            done
            echo "::endgroup::"
          done

  # 키워드 검색량(네이버 검색광고 공식 API). 키워드마다 주 1회만 갱신되고, 새 키워드는 바로 채워진다.
  keyword-volumes:
    name: 키워드 검색량 수집
    if: ${{ inputs.domain == '' || inputs.domain == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 갱신할 키워드가 0이 될 때까지 반복 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          for i in $(seq 1 6); do
            RESP=$(curl -fsS -m 290 -X POST -H "$AUTH_HEADER" "$BASE_URL/api/keyword-volumes/collect") || { echo "::warning::검색량 수집 호출 실패 (iteration $i)"; break; }
            echo "$RESP"
            SAVED=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('saved', 0))")
            REMAINING=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('remaining', 0))")
            if [ "$REMAINING" -le 0 ]; then echo "::notice::검색량 수집 완료"; break; fi
            if [ "$SAVED" -le 0 ]; then echo "::warning::진전 없음, 남은 키워드 $REMAINING"; break; fi
            sleep 5
          done

  report:
    name: 리포트 메일 발송 (배치 완료 후)
    # 정기 실행에서만, 배치가 일부 실패·시간 초과여도 발송한다.
    needs: [blog-batch, cafe-batch, reporter-batch, blog-fallback, reporter-fallback, cafe-fallback]
    if: ${{ always() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/daily-report.yml
    secrets: inherit

  # 수집 결과 요약을 슬랙으로 보낸다. 서버에 슬랙 설정이 없으면 아무 일도 하지 않는다.
  alert:
    name: 슬랙 알림 (배치 완료 후)
    needs: [blog-batch, cafe-batch, reporter-batch, blog-fallback, reporter-fallback, cafe-fallback]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 알림 요청
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # 리포트 메일 호출과 같은 순간에 돌아 502가 난 적이 있어, 실패하면 30초 뒤 두 번 더 시도한다
          for attempt in 1 2 3; do
            STATUS=$(curl -sS -o /dev/null -m 120 -X POST -H "Authorization: Bearer $CRON_SECRET" \
              -w "%{http_code}" "$BASE_URL/api/alerts/daily" || echo "000")
            echo "attempt $attempt: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 30
          done
          echo "::warning::슬랙 알림 요청 실패 (3회)"
